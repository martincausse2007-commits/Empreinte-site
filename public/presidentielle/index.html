<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04061a">
<title>Qui gagne la présidentielle ?</title>
<style>
  :root { --u: 1px; --bg: #04061a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900;
    color: #fff;
  }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #frame { position: relative; overflow: hidden; background: var(--bg); }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; z-index: 5; }

  .hud { position: absolute; z-index: 3; top: calc(var(--u) * 162); left: calc(var(--u) * 14); display: flex; gap: calc(var(--u) * 10); }
  .hud button {
    width: calc(var(--u) * 52); height: calc(var(--u) * 52); border-radius: 50%;
    border: calc(var(--u) * 3) solid rgba(255,255,255,.85); background: rgba(10,16,48,.7); color: #fff;
    font-size: calc(var(--u) * 24); line-height: 1; padding: 0; cursor: pointer;
  }
  .hidden { display: none !important; }

  .screen {
    position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  #home { justify-content: flex-start; padding-top: calc(var(--u) * 196); }
  #home .lead {
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700;
    font-size: calc(var(--u) * 21); line-height: 1.3; max-width: calc(var(--u) * 300);
    margin: 0 0 calc(var(--u) * 150); text-shadow: 0 0 calc(var(--u)*8) #000;
  }
  .btn {
    display: block; width: calc(var(--u) * 270); margin: calc(var(--u) * 8) auto;
    padding: calc(var(--u) * 16) 0; border-radius: calc(var(--u) * 40);
    border: calc(var(--u) * 4) solid #fff; background: #fff; color: #0a0f2e;
    font-family: inherit; font-weight: 900; font-size: calc(var(--u) * 28); letter-spacing: .02em;
    cursor: pointer; box-shadow: 0 0 calc(var(--u) * 24) rgba(255,80,200,.55);
  }
  .btn.ghost { background: rgba(5,8,26,.75); color: #fff; box-shadow: 0 0 calc(var(--u) * 24) rgba(60,200,255,.45); }
  .btn:active { transform: scale(.96); }
  #best { margin-top: calc(var(--u) * 16); font-size: calc(var(--u) * 20); opacity: .9; }

  #victory { background: rgba(4,6,26,.82); padding: 0 calc(var(--u) * 20); }
  #victory .kicker { font-size: calc(var(--u) * 22); opacity: .85; margin-bottom: calc(var(--u) * 6); }
  #winImg {
    width: calc(var(--u) * 300); height: calc(var(--u) * 300);
    filter: drop-shadow(0 0 calc(var(--u) * 30) rgba(255,220,90,.55));
    animation: bob 1.6s ease-in-out infinite;
  }
  #winName {
    font-size: calc(var(--u) * 46); line-height: 1.05; margin: calc(var(--u) * 14) 0 calc(var(--u) * 8);
    text-shadow: 0 0 calc(var(--u) * 18) rgba(255,90,200,.8);
  }
  #winSub { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: calc(var(--u) * 20); opacity: .9; margin-bottom: calc(var(--u) * 18); }
  #winButtons { transition: opacity .4s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(calc(var(--u) * -10)) rotate(3deg); } }

  #toast {
    position: absolute; z-index: 6; left: 50%; bottom: calc(var(--u) * 60); transform: translateX(-50%);
    background: #fff; color: #0a0f2e; padding: calc(var(--u)*10) calc(var(--u)*18); border-radius: calc(var(--u)*20);
    font-size: calc(var(--u) * 18); opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="game"></canvas>
    <canvas id="fx"></canvas>

    <div class="hud hidden" id="hud">
      <button id="btnHome" aria-label="Accueil">⌂</button>
      <button id="btnMute" aria-label="Couper le son">🔊</button>
    </div>

    <div class="screen" id="home">
      <p class="lead">Fusionne les patates identiques.<br>La plus grosse gagne&nbsp;!</p>
      <button class="btn" id="btnPlay">JOUER</button>
      <button class="btn ghost" id="btnVideo">MODE VIDÉO</button>
      <div id="best">Meilleur score : 0</div>
    </div>

    <div class="screen hidden" id="victory">
      <div class="kicker" id="winKicker">RÉSULTAT</div>
      <img id="winImg" alt="">
      <div id="winName">… GAGNE !</div>
      <div id="winSub"></div>
      <div id="winButtons">
        <button class="btn" id="btnReplay">REJOUER</button>
        <button class="btn ghost" id="btnShare">PARTAGER</button>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>
<script src="js/matter.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
